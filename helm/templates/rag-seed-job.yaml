---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-seed
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rag-seed-role
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "-2"
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rag-seed-rolebinding
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "-2"
subjects:
  - kind: ServiceAccount
    name: rag-seed
roleRef:
  kind: Role
  name: rag-seed-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-seed-script
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "-1"
data:
  seed.py: |
    import urllib.request, re, io, time, json, os, ssl, hashlib
    from llama_stack_client import LlamaStackClient

    base_url = os.environ["LLAMASTACK_URL"]
    seed_docs = json.loads(os.environ["SEED_DOCS"])
    client = LlamaStackClient(base_url=base_url, timeout=300)

    # Auto-discover the namespace admin's username via the Kubernetes API.
    # The Job SA has permission to list RoleBindings in its own namespace.
    with open('/var/run/secrets/kubernetes.io/serviceaccount/token') as f:
        k8s_token = f.read().strip()
    with open('/var/run/secrets/kubernetes.io/serviceaccount/namespace') as f:
        namespace = f.read().strip()
    k8s_ctx = ssl.create_default_context(cafile='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt')

    req = urllib.request.Request(
        f'https://kubernetes.default.svc/apis/rbac.authorization.k8s.io/v1/namespaces/{namespace}/rolebindings',
        headers={'Authorization': f'Bearer {k8s_token}', 'Accept': 'application/json'}
    )
    with urllib.request.urlopen(req, context=k8s_ctx, timeout=10) as r:
        rbs = json.loads(r.read())

    username = None
    for rb in rbs.get('items', []):
        if rb.get('roleRef', {}).get('name') == 'admin':
            for subj in rb.get('subjects', []):
                if subj.get('kind') == 'User':
                    username = subj['name']
                    break
        if username:
            break

    if not username:
        raise RuntimeError("Could not find admin User in namespace RoleBindings")

    hashed = hashlib.sha256(username.encode()).hexdigest()[:32]
    print(f"Namespace admin: {username} -> VS name: {hashed}")

    print("Waiting for playground to be ready...")
    while True:
        try:
            urllib.request.urlopen(base_url + "/v1/version", timeout=5)
            print("LlamaStack is ready!")
            break
        except Exception as e:
            print(f"  not ready: {e}")
            time.sleep(10)

    # Find or create the user's auto-provisioned VS (same hash the BFF uses).
    # If it already exists (user opened UI first), seed into it.
    # If not, create it with the auto-provisioning metadata so the BFF adopts it.
    print(f"Looking up vector store '{hashed}'...")
    vs_id = None
    vs_list = client.vector_stores.list()
    for vs in vs_list.data:
        if vs.name == hashed or vs.id == hashed:
            vs_id = vs.id
            print(f"Found existing vector store: {vs_id}")
            break
    if not vs_id:
        vs = client.vector_stores.create(
            name=hashed,
            metadata={"created_by": "auto-provisioning", "username": username},
        )
        vs_id = vs.id
        print(f"Created vector store: {vs_id}")

    existing = {f.filename for f in client.files.list().data}
    print(f"Already uploaded: {existing}")

    def fetch_text(url):
        req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
        with urllib.request.urlopen(req, timeout=15) as r:
            html = r.read().decode("utf-8", errors="ignore")
        html = re.sub(r"<(script|style|nav|header|footer|aside)[^>]*>.*?</\1>", " ", html, flags=re.DOTALL|re.IGNORECASE)
        text = re.sub(r"<[^>]+>", " ", html)
        text = re.sub(r"[ \t]+", " ", text)
        text = re.sub(r"\n{3,}", "\n\n", text)
        return text.strip()[:60000]

    for doc in seed_docs:
        filename, url = doc["filename"], doc["url"]
        if filename in existing:
            print(f"Skipping {filename} (already uploaded)")
            continue
        print(f"Processing {filename} from {url} ...")
        text = fetch_text(url)
        print(f"  {len(text)} chars")
        f = client.files.create(
            file=(filename, io.BytesIO(text.encode("utf-8")), "text/plain"),
            purpose="assistants",
        )
        client.vector_stores.files.create(vector_store_id=vs_id, file_id=f.id)
        print(f"  indexed: {f.id}")

    print("Done.")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rag-seed
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: rag-seed
      containers:
        - name: seeder
          image: {{ .Values.images.llamaStack }}
          command: ["python3", "/scripts/seed.py"]
          env:
            - name: LLAMASTACK_URL
              value: "http://lsd-genai-playground-service.{{ .Release.Namespace }}.svc.cluster.local:8321"
            - name: SEED_DOCS
              value: {{ .Values.rag.seedDocuments | toJson | quote }}
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: rag-seed-script
